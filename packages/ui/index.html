<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="CipherPay UI" />
  <title>CipherPay</title>
  <!-- Browser polyfills - must run before any app chunk; Vite define replaces process/module with these -->
  <script>
    (function() {
      if (typeof globalThis.process === 'undefined') {
        globalThis.process = {
          env: { NODE_ENV: 'production', NODE_DEBUG: undefined },
          browser: true,
          version: '',
          versions: {},
          nextTick: function(fn) { setTimeout(fn, 0); },
          cwd: function() { return '/'; },
          exit: function(code) { throw new Error('process.exit called with code ' + code); }
        };
      }
      if (typeof globalThis.module === 'undefined') {
        globalThis.module = { exports: {} };
      }
    })();
  </script>
  <!-- Load CipherPay SDK bundle - includes Buffer and other polyfills. ?v=3 cache-busts for Buffer.from/toString hex+base64 encoding fix -->
  <script src="/sdk/cipherpay-sdk.browser.js?v=3"></script>
  <!-- Verify Buffer is loaded -->
  <script>
    if (typeof Buffer !== 'undefined' && Buffer.prototype.writeUInt32BE) {
      console.log('[HTML] ✅ Buffer loaded from SDK bundle, has writeUInt32BE:', typeof Buffer.prototype.writeUInt32BE);
    } else {
      console.error('[HTML] ❌ Buffer not properly loaded from SDK bundle');
    }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
